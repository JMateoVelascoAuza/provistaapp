<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hoja de prueba — Entreobra</title>
<style>
  :root { --borde: #dadce0; --cabeza: #f1f3f4; --verde: #188038; --nuevo: #fff3cd; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 13px/1.4 Arial, system-ui, sans-serif; color: #202124; background: #fff; }
  header { position: sticky; top: 0; z-index: 2; background: #fff; border-bottom: 1px solid var(--borde); padding: 10px 16px; display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; }
  header h1 { font-size: 16px; font-weight: 500; margin: 0; display: flex; align-items: center; gap: 8px; }
  header h1 span { width: 22px; height: 22px; border-radius: 3px; background: var(--verde); display: inline-block; }
  .aviso { background: #e8f0fe; color: #174ea6; padding: 4px 10px; border-radius: 12px; font-size: 12px; }
  .vivo { font-size: 12px; color: #5f6368; }
  .vivo b { color: var(--verde); }
  button { font: inherit; border: 1px solid var(--borde); background: #fff; border-radius: 4px; padding: 5px 12px; cursor: pointer; }
  button:hover { background: var(--cabeza); }
  main { padding: 16px; display: grid; gap: 22px; }
  h2 { font-size: 14px; font-weight: 600; margin: 0 0 8px; display: flex; gap: 8px; align-items: baseline; }
  h2 small { font-weight: 400; color: #5f6368; }
  .tabla { overflow-x: auto; border: 1px solid var(--borde); }
  table { border-collapse: collapse; min-width: 100%; }
  th, td { border: 1px solid var(--borde); padding: 4px 8px; white-space: nowrap; text-align: left; }
  th { background: var(--cabeza); font-weight: 600; position: sticky; top: 0; }
  td.n, th.n { background: var(--cabeza); color: #5f6368; text-align: center; width: 36px; }
  tr.nuevo td:not(.n) { background: var(--nuevo); transition: background 2s; }
  .vacio { color: #5f6368; padding: 10px; }
  .correo { border: 1px solid var(--borde); border-radius: 8px; padding: 10px 12px; margin-bottom: 8px; }
  .correo b { display: block; }
  .correo pre { margin: 6px 0 0; font: 12px/1.45 Arial, sans-serif; white-space: pre-wrap; color: #3c4043; }
  .correo .para { color: #5f6368; font-size: 12px; }
  .envio { font-size: 12px; padding: 3px 0; border-bottom: 1px dashed var(--borde); }
  .ok { color: var(--verde); font-weight: 600; } .mal { color: #c5221f; font-weight: 600; }
  .columnas { display: grid; gap: 22px; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); }
</style>
</head>
<body>
<header>
  <h1><span></span>Entreobra – Registro proveedores <small style="color:#5f6368;font-weight:400">(copia de prueba)</small></h1>
  <span class="aviso">Simulación local: corre el Code.gs real, no la hoja del cliente</span>
  <span class="vivo" id="vivo">Actualizando…</span>
  <button id="vaciar" type="button">Vaciar hoja de prueba</button>
</header>
<main>
  <div id="hojas"></div>
  <div class="columnas">
    <section><h2>Correos de aviso <small>(lo que recibiría el cliente)</small></h2><div id="correos"></div></section>
    <section><h2>Últimos envíos <small>(respuesta del script)</small></h2><div id="envios"></div></section>
  </div>
</main>
<script>
  const vistos = {};
  const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
  let confirmar = false;

  async function actualizar() {
    try {
      const e = await (await fetch("/estado.json", { cache: "no-store" })).json();
      document.getElementById("hojas").innerHTML = e.orden.map((nombre) => {
        const filas = e.hojas[nombre] || [];
        const encabezado = filas[0] || [];
        const antes = vistos[nombre] ?? filas.length;
        const cuerpo = filas.slice(1).map((f, i) => {
          const nuevo = i + 2 > antes ? ' class="nuevo"' : "";
          return `<tr${nuevo}><td class="n">${i + 2}</td>${encabezado.map((_, j) => `<td>${esc(f[j])}</td>`).join("")}</tr>`;
        }).join("");
        vistos[nombre] = filas.length;
        return `<section><h2>Pestaña «${esc(nombre)}» <small>${Math.max(0, filas.length - 1)} filas</small></h2>
          <div class="tabla"><table><thead><tr><th class="n">1</th>${encabezado.map((h) => `<th>${esc(h)}</th>`).join("")}</tr></thead>
          <tbody>${cuerpo || `<tr><td class="n"></td><td colspan="${encabezado.length}" class="vacio">Sin filas todavía</td></tr>`}</tbody></table></div></section>`;
      }).join("");
      document.getElementById("correos").innerHTML = e.correos.length
        ? e.correos.slice(0, 10).map((c) => `<div class="correo"><b>${esc(c.asunto)}</b><span class="para">Para: ${esc(c.para)} · ${esc(c.hora)}</span><pre>${esc(c.cuerpo)}</pre></div>`).join("")
        : '<p class="vacio">Todavía no se envió ningún aviso.</p>';
      document.getElementById("envios").innerHTML = e.envios.length
        ? e.envios.slice(0, 15).map((v) => `<div class="envio">${esc(v.hora)} · ${esc(v.formulario)} → <span class="${v.respuesta.ok ? "ok" : "mal"}">${v.respuesta.ok ? (v.respuesta.duplicado ? "OK (duplicado, no se repitió)" : "OK, " + v.respuesta.filas + " fila(s)") : "Rechazado: " + esc(v.respuesta.error)}</span></div>`).join("")
        : '<p class="vacio">Todavía no hubo envíos.</p>';
      document.getElementById("vivo").innerHTML = `<b>●</b> En vivo · actualizado ${new Date().toLocaleTimeString()}`;
    } catch {
      document.getElementById("vivo").textContent = "Sin conexión con el banco de pruebas";
    }
  }
  document.getElementById("vaciar").onclick = async (ev) => {
    if (!confirmar) { confirmar = true; ev.target.textContent = "¿Seguro? Toca otra vez"; setTimeout(() => { confirmar = false; ev.target.textContent = "Vaciar hoja de prueba"; }, 3000); return; }
    await fetch("/reiniciar", { method: "POST" });
    for (const k in vistos) delete vistos[k];
    confirmar = false; ev.target.textContent = "Vaciar hoja de prueba";
    actualizar();
  };
  actualizar();
  setInterval(actualizar, 1500);
</script>
</body>
</html>
